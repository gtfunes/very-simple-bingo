<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self'; img-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Bolillero de bingo: saca bolillas al azar y las anuncia en voz alta." />
    <meta name="theme-color" content="#12122a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bolillero" />
    <title>Bolillero</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="analytics.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1>🎱 Bolillero</h1>
      <div class="toggles">
        <button id="auto" type="button" aria-label="Automático" aria-pressed="false">▶ Auto</button>
        <button id="mute" type="button" aria-label="Voz" aria-pressed="true">🔊 Voz</button>
      </div>
    </header>

    <main class="app">
      <section class="caller" aria-label="Bolilla actual">
        <div class="ball empty" id="ball">
          <span class="ball-number" id="current">–</span>
        </div>
        <p class="saying" id="saying" hidden></p>
        <p class="card-news" id="card-news" hidden></p>
        <p class="status" id="status"></p>
        <p class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></p>

        <div class="actions">
          <button id="draw" class="primary" type="button">Sacar bolilla</button>
          <button id="repeat" type="button">Repetir</button>
        </div>

        <div class="tools" id="tools" hidden>
          <button id="undo" type="button">↩ Deshacer</button>
          <button id="claim-line" class="claim" type="button">¡Línea!</button>
          <button id="claim-bingo" class="claim" type="button">¡Bingo!</button>
        </div>

        <div class="history">
          <h2>Anteriores</h2>
          <ol id="history" class="history-list"></ol>
        </div>

        <div class="cards" id="cards" hidden>
          <h2>Cartones <span class="count" id="cards-set-name"></span></h2>
          <p class="cards-empty" id="cards-empty">Nadie tiene línea todavía</p>
          <div class="cards-row" id="cards-bingo-row">
            <span class="cards-label">Bingo</span>
            <ol class="chips bingo" id="cards-bingo"></ol>
          </div>
          <div class="cards-row" id="cards-line-row">
            <span class="cards-label">Línea</span>
            <ol class="chips" id="cards-line"></ol>
          </div>
        </div>
      </section>

      <section class="board-wrap" aria-labelledby="board-title">
        <h2 id="board-title">Tablero <span id="count" class="count"></span></h2>
        <ol id="board" class="board"></ol>
      </section>

      <section class="options" aria-label="Opciones">
        <label class="field">
          Bolillas
          <select id="max">
            <option value="90">1 a 90</option>
            <option value="75">1 a 75</option>
          </select>
        </label>
        <label class="field">
          Ritmo
          <select id="pace"></select>
        </label>
        <label class="field" id="voice-field">
          Voz
          <select id="voice">
            <option value="">Automática</option>
          </select>
        </label>
        <label class="field" id="style-field">
          Estilo
          <select id="style"></select>
        </label>
        <label class="field check">
          Dichos
          <input type="checkbox" id="sayings" />
        </label>
        <label class="field" id="card-set-field" hidden>
          Cartones
          <select id="card-set">
            <option value="">Ninguno</option>
          </select>
        </label>
        <button id="reset" type="button">Nuevo juego</button>
      </section>
    </main>
  </body>
</html>

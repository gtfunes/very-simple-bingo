<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Bolillero de bingo: saca bolillas al azar y las anuncia en voz alta." />
    <meta name="theme-color" content="#12122a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bolillero" />
    <title>Bolillero</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1>🎱 Bolillero</h1>
      <button id="mute" type="button" aria-label="Voz" aria-pressed="true">🔊 Voz</button>
    </header>

    <main class="app">
      <section class="caller" aria-label="Bolilla actual">
        <div class="ball empty" id="ball">
          <span class="ball-number" id="current">–</span>
        </div>
        <p class="status" id="status"></p>
        <p class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></p>

        <div class="actions">
          <button id="draw" class="primary" type="button">Sacar bolilla</button>
          <button id="repeat" type="button">Repetir</button>
        </div>

        <div class="history">
          <h2>Anteriores</h2>
          <ol id="history" class="history-list"></ol>
        </div>
      </section>

      <section class="board-wrap" aria-labelledby="board-title">
        <h2 id="board-title">Tablero <span id="count" class="count"></span></h2>
        <ol id="board" class="board"></ol>
      </section>

      <section class="options" aria-label="Opciones">
        <label class="field">
          Bolillas
          <select id="max">
            <option value="90">1 a 90</option>
            <option value="75">1 a 75</option>
          </select>
        </label>
        <button id="reset" type="button">Nuevo juego</button>
      </section>
    </main>
  </body>
</html>
